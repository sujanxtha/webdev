    <h1>5-Day Weather Forecast</h1>

    <p>
        This weather application uses Axios to retrieve weather
        data and Chart.js to display temperature forecasts.
    </p>

    <label for="kaupunki">City:</label>
    <input type="text" id="kaupunki" value="Helsinki">

    <label for="apiKey">API Key:</label>
    <input type="password" id="apiKey"
           placeholder="Enter your OpenWeather API key">

    <button id="haeSaaPainike">Get Weather</button>

    <p id="saaYllatys" style="display: none;">
        ☁ The cloud crew is checking the weather!
    </p>

    <p id="message" role="status"></p>

    <h2 id="cityName"></h2>

    <p id="forecastSummary"></p>

    <label for="chartType">Chart Type:</label>
    <select id="chartType" onchange="paivitaKaavio()">
        <option value="line">Line</option>
        <option value="bar">Bar</option>
    </select>

    <div style="max-width: 900px; margin-top: 20px;">
        <canvas id="tempChart"></canvas>
    </div>

    <script src="script.js"></script>
