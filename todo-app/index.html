
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Organize your daily tasks easily.</p>

    <form id="taskForm" novalidate>
      <label for="taskInput">Enter a new task</label>

      <div class="input-row">
        <input
          type="text"
          id="taskInput"
          placeholder="e.g. Complete JavaScript assignment"
          maxlength="100"
        >
        <button type="submit">Add Task</button>
      </div>

      <p id="errorMessage" class="error" role="alert"></p>
    </form>

    <section class="task-section">
      <h2>My Tasks</h2>

      <p id="taskCounter">0 tasks remaining</p>

      <div class="filters">
        <button type="button" class="filx ter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">Active</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>

      <ul id="taskList"></ul>

      <p id="emptyMessage">No tasks to show.</p>

      <button type="button" id="clearCompleted">
        Clear Completed Tasks
      </button>
    </section>
  </main>

</body>
</html>
